# SU-27 Baseline训练配置
# 任务：航向控制（heading control）
# 目标：学习基本的飞行控制能力

# task config
task: heading

# simulation config
sim_freq: 60
agent_interaction_steps: 12  # step 0.2s

# termination config
max_steps: 1200              # episode length: 240s (SU27需要更长时间响应)
altitude_limit: 2500         # 最低高度限制（米）
acceleration_limit_x: 8.0    # SU27重量大，加速度限制小一些
acceleration_limit_y: 8.0    # 减小横向加速度限制
acceleration_limit_z: 8.0    # 减小垂直加速度限制

# aircraft config
aircraft_configs: {
  A0100: {
    color: Red,
    model: su27sk,             # 使用SU-27模型
    max_heading_increment: 150,       # degree (SU27转弯半径大)
    max_altitude_increment: 6000,     # feet (SU27爬升慢一些)
    max_velocities_u_increment: 80,   # meter (SU27加速慢一些)
    check_interval: 40,               # second (给更多时间执行机动)
    init_state: {
      ic_long_gc_deg: 120.0,
      ic_lat_geod_deg: 60.0,
      ic_h_sl_ft: 26247,       # 8000米高度（SU-27巡航高度）
      ic_psi_true_deg: 0.0,
      ic_u_fps: 820.0,         # 250m/s ≈ 820fps（SU-27巡航速度）
    }
  }
}

# battle field
battle_field_center: [120.0, 60.0, 0.0]

# reward config
AltitudeReward_safe_altitude: 4.0
AltitudeReward_danger_altitude: 3.5
AltitudeReward_Kv: 0.2

# SU27奖励缩放（考虑其飞行特性）
HeadingReward_scale: 8.0       # 航向奖励权重（SU27转弯慢，降低要求）
AltitudeReward_scale: 1.5      # 高度奖励权重（SU27需要更好高度控制）
SmoothControl_scale: 2.0       # 平滑控制奖励（重要！SU27惯性大）
EnergyEfficiency_scale: 1.2    # 能量效率奖励（SU27耗油多）