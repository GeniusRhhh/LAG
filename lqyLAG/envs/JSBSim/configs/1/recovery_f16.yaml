# task config
task: recovery

# simulation config
sim_freq: 60
agent_interaction_steps: 12  # step 0.2s

# termination config
max_steps: 750               # episode length: 150s
altitude_limit: 80           # allow low-altitude recovery before hard crash
acceleration_limit_x: 12.0
acceleration_limit_y: 12.0
acceleration_limit_z: 12.0
RecoverySuccess_required_stable_steps: 35
RecoveryTeacher_release_stable_steps: 45
RecoveryTeacher_min_hold_steps: 30
RecoveryTeacher_early_vc_mps: 150.0
RecoveryTeacher_early_sink_mps: 3.0
RecoveryTeacher_early_bank_deg: 35.0
RecoveryTeacher_early_aoa_deg: 10.0

# aircraft config
aircraft_configs: {
  A0100: {
    color: Red,
    model: f16,
    max_heading_increment: 180,
    max_altitude_increment: 7000,
    max_velocities_u_increment: 120,
    check_interval: 20,
    init_state: {
      ic_long_gc_deg: 120.0,
      ic_lat_geod_deg: 60.0,
      ic_h_sl_ft: 20000,
      ic_psi_true_deg: 0.0,
      ic_u_fps: 650.0,
    }
  }
}

# battlefield center
battle_field_center: [120.0, 60.0, 0.0]

# reward config
RecoveryReward_target_vc_mps: 145.0
RecoveryReward_min_vc_mps: 75.0
RecoveryReward_safe_aoa_deg: 10.0
RecoveryReward_bad_aoa_deg: 22.0
RecoveryReward_max_sink_mps: 18.0
RecoveryReward_safe_roll_deg: 35.0
