# 战术系统BVR配置文件（defensive 初始态势）
# 约束：敌我双方初始x,y不变，仅调整高度/速度，使我方更低更慢。
# conservative_clear 请使用 tactical_bvr.yaml

# task config
task: multiplecombat

# simulation config
sim_freq: 60
agent_interaction_steps: 12 # step 0.2s

# termination config
max_steps: 3300           # episode length: 660s (11分钟)
altitude_limit: 2500
acceleration_limit_x: 10.0
acceleration_limit_y: 10.0
acceleration_limit_z: 10.0

# 飞机配置 - 使用经纬度设置120km距离
# 注意：ic_long_gc_deg / ic_lat_geod_deg 不变（保持与 tactical_bvr.yaml 完全一致）
aircraft_configs: {
  A0100: {
    color: Red,
    model: f16,
    init_state: {
      ic_long_gc_deg: 120.0,
      ic_lat_geod_deg: 60.0,
      ic_h_sl_ft: 20000,          # 我方更低（约4267m，仍高于 altitude_limit 2500m）
      ic_psi_true_deg: 0.0,
      ic_u_fps: 800.0,            # 我方更慢
    },
    missile: 4
  },
  A0200: {
    color: Red,
    model: f16,
    init_state: {
      ic_long_gc_deg: 120.05,
      ic_lat_geod_deg: 60.0,
      ic_h_sl_ft: 20000,
      ic_psi_true_deg: 0.0,
      ic_u_fps: 800.0,
    },
    missile: 4
  },
  B0100: {
    color: Blue,
    model: f16,
    init_state: {
      ic_long_gc_deg: 120.0,
      ic_lat_geod_deg: 61.17,
      ic_h_sl_ft: 22000,          # 敌方更高
      ic_psi_true_deg: 180.0,
      ic_u_fps: 900.0,            # 敌方更快
    },
    missile: 4
  },
  B0200: {
    color: Blue,
    model: f16,
    init_state: {
      ic_long_gc_deg: 120.01,
      ic_lat_geod_deg: 61.17,
      ic_h_sl_ft: 22000,
      ic_psi_true_deg: 180.0,
      ic_u_fps: 900.0,
    },
    missile: 4
  }
}

# 武器系统配置
max_attack_angle: 60
max_attack_distance: 80000    # 80km最大攻击距离
min_attack_interval: 30

# 战场中心 (longitude, latitude, altitude)
battle_field_center: [120.0, 60.54, 0.0]  # 中点位置

# 战术距离配置 - 完整的8个阶段
tactical_distances: {
  # 战术阶段控制距离 (米)
  NLT: 120000,
  MELD: 100000,
  MTR: 80000,
  LR: 78000,
  TR: 75000,
  DOR: 70000,
  DR: 65000,
  MAR: 40000,

  # MultipleCombatEnv必需的标准距离
  detection_range: 120000,
  engagement_range: 100000,
  launch_range: 78000,
  mar_range: 40000,
  wez_range: 78000,
  rmax: 80000,
  rmin: 5000,

  # 雷达控制距离
  track_range: 100000,
  lock_range: 80000,
  return_search_range: 40000,
}

# 战术参数配置
tactical_params: {
  crank_angle: 30.0,
  turn_rate: 8.0,
  short_skate_crank_angle: 30.0,
  short_skate_turn_cold_angle: 90.0,
  short_skate_crank_duration: 6.0,
  short_skate_turn_cold_duration: 15.0,

  altitude_separation: 500.0,
  climb_rate: 10.0,
  descent_rate: 10.0,

  acceleration: 50.0,
  deceleration: 50.0,
}

# reward config
PostureReward_scale: 5.0
PostureReward_potential: true
PostureReward_orientation_version: v2
PostureReward_range_version: v3

AltitudeReward_safe_altitude: 4.0
AltitudeReward_danger_altitude: 3.5
AltitudeReward_Kv: 0.2

# 数据记录配置
data_recording: {
  enabled: true,
  output_dir: "tactical_simulation_results",
  record_interval: 0.2,
  save_trajectory: true,
  save_radar_status: true,
  save_missile_status: true,
  save_acmi: true
}
