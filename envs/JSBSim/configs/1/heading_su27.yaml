# SU-27 Baseline训练配置
# 任务：航向控制（heading control）
# 目标：学习基本的飞行控制能力

# task config
task: heading

# simulation config
sim_freq: 60
agent_interaction_steps: 12  # step 0.2s

# termination config
max_steps: 1000              # episode length: 200s
altitude_limit: 2500         # 最低高度限制（米）
acceleration_limit_x: 10.0
acceleration_limit_y: 10.0
acceleration_limit_z: 10.0

# aircraft config
aircraft_configs: {
  A0100: {
    color: Red,
    model: su27sk,             # 使用SU-27模型
    max_heading_increment: 180,       # degree
    max_altitude_increment: 7000,     # feet
    max_velocities_u_increment: 100,  # meter
    check_interval: 30,               # second
    init_state: {
      ic_long_gc_deg: 120.0,
      ic_lat_geod_deg: 60.0,
      ic_h_sl_ft: 26247,       # 8000米高度（SU-27巡航高度）
      ic_psi_true_deg: 0.0,
      ic_u_fps: 820.0,         # 250m/s ≈ 820fps（SU-27巡航速度）
    }
  }
}

# battle field
battle_field_center: [120.0, 60.0, 0.0]

# reward config
AltitudeReward_safe_altitude: 4.0
AltitudeReward_danger_altitude: 3.5
AltitudeReward_Kv: 0.2

# 奖励缩放（参考F-16 baseline）
HeadingReward_scale: 10.0      # 航向奖励权重（主要任务）
AltitudeReward_scale: 1.0      # 高度奖励权重（次要任务）
