# CAP巡逻配置文件
# 
# ========== 航向修改说明 ==========
# ic_psi_true_deg: 飞机初始航向（度）
#   0   = 北
#   90  = 东
#   180 = 南
#   270 = 西
#
# 当前配置：我方南北巡逻（热段朝北0°，冷段朝南180°）
#
# 示例：如需改为东西巡逻（热段朝东）：
#   - A0100/A0300: ic_psi_true_deg: 90  (朝东)
#   - A0200/A0400: ic_psi_true_deg: 270 (朝西)
#   - 同时需修改patrol_task.py中的边界检测逻辑
# ================================

task: multiplecombat

# ===== CAP v2 动态配置（可选） =====
# run_cap_simulation.py 会读取本文件；检测到以下块时，会根据它们动态生成 aircraft_configs，
# 从而实现“以 A0100 航向定义战场坐标系，僚机/敌机航向随之动态计算”。
base_reference:
  a0100:
    longitude: 120.6757
    latitude: 60.0
    heading: 0.0   # 例如 45.0 -> A0100=45°, A0200/B*=225°

formation:
  wingman_y_offset: 100.0
  lead_x:
    left: 75.0
    right: 125.0
  wingman_x:
    left: 25.0
    right: 175.0

enemy:
  spawn_y: 250.0  # 调整为250km，确保在雷达探测范围内
  spawn_x: [40, 80, 120, 160]

# ===== 静态 aircraft_configs（兼容保留） =====
# 未启用动态生成时，环境仍会直接读取本块。

aircraft_configs:
  # 左编队长机 A0100: 战场坐标(75,0)
  A0100:
    color: Red
    model: su27sk
    init_state:
      ic_long_gc_deg: 120.6757
      ic_lat_geod_deg: 60.0
      ic_h_sl_ft: 32800
      ic_psi_true_deg: 0.0       # 朝北
      ic_u_fps: 1251.1
    missile: 4
    
  # 左编队僚机 A0200: 战场坐标(25,100)
  A0200:
    color: Red
    model: su27sk
    init_state:
      ic_long_gc_deg: 120.4252
      ic_lat_geod_deg: 60.2009
      ic_h_sl_ft: 32800
      ic_psi_true_deg: 180.0     # 朝南
      ic_u_fps: 1251.1
    missile: 4
    
  # 右编队长机 A0300: 战场坐标(125,0)
  A0300:
    color: Red
    model: su27sk
    init_state:
      ic_long_gc_deg: 121.3766
      ic_lat_geod_deg: 60.0
      ic_h_sl_ft: 32800
      ic_psi_true_deg: 0.0       # 朝北
      ic_u_fps: 1251.1
    missile: 4
    
  # 右编队僚机 A0400: 战场坐标(175,100) - 🔥 经度微调向右，防止巡逻后偏左
  A0400:
    color: Red
    model: su27sk
    init_state:
      ic_long_gc_deg: 121.2261
      ic_lat_geod_deg: 60.2009
      ic_h_sl_ft: 32800
      ic_psi_true_deg: 180.0     # 朝南
      ic_u_fps: 1251.1
    missile: 4
  
  # 敌方飞机 B0100-B0400
  # 初始位置：Y≈200km（纬度61.8°，距我方约200km，在雷达探测范围边缘）
  B0100:
    color: Blue
    model: f16
    init_state:
      ic_long_gc_deg: 120.3604
      ic_lat_geod_deg: 62.4      # 约200km，在雷达探测范围内
      ic_h_sl_ft: 32800
      ic_psi_true_deg: 180.0
      ic_u_fps: 1251.1
    missile: 4
    
  # 🔥 B0200靠近B0100，形成左编队
  B0200:
    color: Blue
    model: f16
    init_state:
      ic_long_gc_deg: 120.4604
      ic_lat_geod_deg: 62.4
      ic_h_sl_ft: 32800
      ic_psi_true_deg: 180.0
      ic_u_fps: 1251.1
    missile: 4
    
  # 🔥 B0300靠近B0400，形成右编队
  B0300:
    color: Blue
    model: f16
    init_state:
      ic_long_gc_deg: 121.3414
      ic_lat_geod_deg: 62.4
      ic_h_sl_ft: 32800
      ic_psi_true_deg: 180.0
      ic_u_fps: 1251.1
    missile: 4
    
  B0400:
    color: Blue
    model: f16
    init_state:
      ic_long_gc_deg: 121.4414
      ic_lat_geod_deg: 62.4
      ic_h_sl_ft: 32800
      ic_psi_true_deg: 180.0
      ic_u_fps: 1251.1
    missile: 4

max_steps: 10000
time_interval: 0.2
